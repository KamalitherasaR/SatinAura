<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SatinAura</title>
    <link rel="icon" type="image/png" href="./images/LogoSatinAura.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <h1 class="logo">SatinAura</h1>
            <a href="cart.html">Back to Cart</a>
        </nav>
    </header>

    <main class="checkout-section">

        <div class="checkout-heading">
            <p class="subtitle">ALMOST YOURS</p>
            <h2>Complete Your Order</h2>
            <p>Enter your details to complete your demo order.</p>
        </div>

        <div class="checkout-container">

            <form id="checkout-form" class="checkout-form">

                <h3>Delivery Information</h3>

                <label for="name">Full Name</label>
                <input type="text" id="name"
                    placeholder="Enter your full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email"
                    placeholder="Enter your email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                    placeholder="Enter your phone number"
                    pattern="[0-9]{10}" required>

                <label for="address">Delivery Address</label>
                <textarea id="address"
                    placeholder="Enter your complete address"
                    required></textarea>

                <button type="submit" id="place-order">
                    Place Order
                </button>

            </form>

            <div class="order-summary">

                <h3>Order Summary</h3>

                <div id="checkout-items">
                    <!-- Order details appear here -->
                </div>

                <div class="checkout-total">
                    <span>Total Amount</span>
                    <strong id="checkout-total">Total: ₹0</strong>
                </div>

            </div>

        </div>

        <p id="order-message"></p>

    </main>

    <footer>
        <h2>StyleAura</h2>
        <p>Fashion that defines your style.</p>
        <p>© 2026 StyleAura. All rights reserved.</p>
    </footer>

    <script src="checkout.js"></script>

</body>
</html>
