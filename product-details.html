<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StyleAura</title>
    <link rel="icon" type="image/png" href="./images/LogoStyleAura.png">

    <link rel="stylesheet" href="style.css">

    <script src="product-details.js" defer></script>
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <h1 class="logo">StyleAura</h1>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="men.html">Men</a></li>
                <li><a href="women.html">Women</a></li>
                <li><a href="shoes.html">Shoes</a></li>
                <li><a href="accessories.html">Accessories</a></li>
            </ul>
            <div class="search-wrapper">
                <a href="#products" class="search-icon">
                    <img src="images/search.png" alt="Search">
                </a>
            </div>
            <a href="cart.html" class="cart">🛒 <span>0</span> </a>

        </nav>
    </header>


    <!-- Product Details -->
    <section class="product-details">

        <!-- Product Image -->
        <div class="details-image">

            <img
                id="product-image"
                src="images/blazer.jpg"
                alt="Product image"
            >

        </div>


        <!-- Product Information -->
        <div class="details-content">

            <p class="subtitle">STYLEAURA COLLECTION</p>

            <h1 id="product-name">Loading product...</h1>

            <h2 id="product-price"></h2>

            <p id="product-description">
                Discover premium fashion at StyleAura.
            </p>


            <!-- Size Selection -->
            <label for="product-size">Select Size</label>

            <select id="product-size">
                <option value="S">Small (S)</option>
                <option value="M" selected>Medium (M)</option>
                <option value="L">Large (L)</option>
                <option value="XL">Extra Large (XL)</option>
            </select>


            <!-- Quantity Selection -->
            <label for="product-quantity">Quantity</label>

            <input
                type="number"
                id="product-quantity"
                value="1"
                min="1"
                max="10"
            >


            <div class="details-buttons">

                <button type="button" class="add-to-cart" id="details-add-to-cart">
                    Add to Cart
                </button>

                <button type="button" class="continue-btn" id="continue-shopping">
                    Continue Shopping
                </button>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <h2>StyleAura</h2>

        <p>Fashion that defines your style.</p>

        <p class="copyright">
            © 2026 StyleAura. All rights reserved.
        </p>

    </footer>

</body>

</html>
